description: Организация Acme — всё внутри <workspace>/Acme

# Каталог <workspace>/Acme — цель-группа: агент, открытый в нём (а не в проекте), получает
# правила и MCP слоёв workspace + Acme. Проекты внутри получают для Claude только свои слои
# ниже группы (остальное Claude читает из файла группы сам). Затем: miksy sync --all
target: true

# Доверие проектам организации, где команда закоммитила исполняемые настройки агента
# (хуки и разрешения .claude/settings.json, серверы .mcp.json, .codex/config.toml): с true
# miksy ставит доверие и одобряет серверы .mcp.json сам, без вопроса. Без этой строки —
# решение пользователя (вопрос в конце sync в терминале или miksy trust <проект>).
# false — запрет: miksy доверие не ставит и снимает своё.
trust: { claude: true, codex: true }
