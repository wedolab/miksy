description: Общие правила всех проектов workspace
# Командные skills из репо каждого проекта — агентам, которые их сами не видят.
# auto: не больше 30 на проект; проект может указать all, список имён или false
import_skills: false # Включить импорт командных skills: auto (до 30), all или список имён.
# Каталог над проектами как цель («рабочее место» уровнем выше, например ~/Projects/Acme): в layer.yaml
# его слоя (layers/tree/Acme/layer.yaml) — строка
#   target: true
# Группа получает слои до своего уровня; проекты внутри — для Claude только свои слои ниже
# группы (остальное Claude читает из файла группы сам). Здесь, в корне дерева, target не действует.
